[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mn-desertification"
version = "0.1.0"
description = "Rangeland productivity loss in Mongolia beyond what the weather explains, at NAMEM's monitoring sites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "shapely>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipywidgets", "colorcet"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/zayau/mn-desertification"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
